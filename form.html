<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Habits Pledge</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Sustainability</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="info.html">Explore Habits</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="form.html">Pledge</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="bg-success text-white text-center py-5">
      <div class="container">
        <h1 id="head">Pledge Your Green Habit</h1>
        <p class="lead">Join the movement. Make a difference today.</p>
      </div>
    </header>

    <!-- form-->
    <section class="container my-5">
      <form id="pledgeForm" class="bg-light p-4 rounded shadow">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your name"/>
          <div class="invalid-feedback" id="nameError"></div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="name@example.com"/>
          <div class="invalid-feedback" id="emailError"></div>
        </div>

        <div class="mb-3">
          <label for="habitSelect" class="form-label">Choose a green habit to pledge</label>
          <select class="form-select" id="habitSelect">
            <option value="">Select one...</option>
            <option value="Use Reusable Bags">Use Reusable Bags</option>
            <option value="Bike or Walk More">Bike or Walk More</option>
            <option value="Conserve Water">Conserve Water</option>
            <option value="Recycle Properly">Recycle Properly</option>
            <option value="Plant a Tree">Plant a Tree</option>
          </select>
          <div class="invalid-feedback" id="habitSelectError"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Do you already practice green habits?</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="practiceHabits" id="practiceYes" value="Yes"/>
            <label class="form-check-label" for="practiceYes">Yes</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="practiceHabits" id="practiceNo" value="No" />
            <label class="form-check-label" for="practiceNo">No</label>
          </div>
          <div class="invalid-feedback d-block" id="practiceError" style="display:none"></div>
        </div>

        <div class="mb-3">
          <label for="idea" class="form-label">Share your own green habit idea</label>
          <textarea class="form-control" id="idea" rows="3" maxlength="200" placeholder="Max 200 characters"></textarea>
          <div id="charCount" class="form-text">0 / 200 characters</div>
        </div>

        <div class="mb-3">
          <label for="sustainLevel" class="form-label">Rate your sustainability level (1-10)</label>
          <input type="range" class="form-range" min="1" max="10" step="1" id="sustainLevel" />
          <div id="rangeNumbers" class="d-flex justify-content-between small">
            <span>1</span><span>2</span><span>3</span><span>4</span>
            <span>5</span><span>6</span><span>7</span><span>8</span>
            <span>9</span><span>10</span>
          </div>
        </div>

        <button type="submit" class="btn btn-success">Submit Pledge</button>
      </form>
    </section>

    <!-- Pledge Wall -->
    <section class="container my-5">
      <h2 class="text-center mb-4">Pledge Wall</h2>
      <div id="pledgeWall" class="row gy-3"></div>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
